<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>即兴表达训练场 · Impromptu Lab</title>
<meta name="description" content="双语随机演讲与写作练习：抽题、限时准备、语音或文本作答、AI 评分复盘与错误集锦。">
<style>
:root{
  --bg:#f4f2ee;
  --ink:#20242c;
  --ink-2:#4a5058;
  --muted:#7d838c;
  --line:rgba(32,36,44,.10);
  --accent:#6f86a6;
  --accent-deep:#4d6484;
  --accent-soft:#e6edf6;
  --warm:#c99c8d;
  --warm-soft:#f6ebe6;
  --green:#8aa392;
  --green-soft:#e8efe9;
  --danger:#c2705f;
  --shadow:0 18px 40px -22px rgba(38,44,56,.35);
  --shadow-sm:0 8px 22px -14px rgba(38,44,56,.35);
  --r:22px;
  --side:240px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  background:
    radial-gradient(1100px 620px at 8% -8%, #e9eef7 0%, rgba(233,238,247,0) 62%),
    radial-gradient(900px 540px at 96% 10%, #f6eae4 0%, rgba(246,234,228,0) 60%),
    radial-gradient(800px 600px at 60% 110%, #eef1e9 0%, rgba(238,241,233,0) 60%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
::selection{background:var(--accent-soft)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;gap:24px;padding:22px;max-width:1400px;margin:0 auto}
.side{
  width:var(--side);flex:0 0 var(--side);position:sticky;top:22px;align-self:flex-start;
  height:calc(100vh - 44px);display:flex;flex-direction:column;gap:18px;
  padding:22px 18px;border-radius:26px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:var(--shadow);
  backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15);
}
.brand{display:flex;gap:11px;align-items:center;padding:2px 4px 8px}
.brand-mark{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  font-weight:700;font-size:17px;color:#fff;letter-spacing:.02em;
  background:linear-gradient(150deg,#7d94b3,#576f90);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 18px -12px rgba(60,80,110,.8);
}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text b{font-size:15px;font-weight:650;letter-spacing:.01em}
.brand-text span{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:15px;
  color:var(--ink-2);font-size:14px;transition:.18s ease;width:100%;text-align:left;
}
.nav-item svg{width:17px;height:17px;opacity:.72;flex:0 0 auto}
.nav-item:hover{background:rgba(255,255,255,.6)}
.nav-item.on{color:#20304a;background:linear-gradient(180deg,#fff,#eef3fa);box-shadow:inset 0 1px 0 #fff,var(--shadow-sm);font-weight:600}
.nav-item.on svg{opacity:1}
.nav-item .dot{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang-switch{display:flex;padding:4px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.lang-switch button{flex:1;padding:8px 0;border-radius:11px;font-size:12.5px;color:var(--muted);transition:.18s}
.lang-switch button.on{background:linear-gradient(180deg,#fff,#e9eff7);color:var(--accent-deep);font-weight:600;box-shadow:0 4px 12px -8px rgba(50,70,100,.5)}
.privacy{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 4px}
.topbar .crumb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.back{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-sm);
}
.back:hover{background:#fff}
.topbar h1{font-size:19px;font-weight:650;letter-spacing:.01em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.view{display:flex;flex-direction:column;gap:16px;padding-bottom:40px;animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- surfaces ---------- */
.card{
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  border-radius:var(--r);box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
  padding:22px;
}
.card.flat{background:rgba(255,255,255,.55);box-shadow:none}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-head h2{font-size:15.5px;font-weight:650;letter-spacing:.01em}
.card-head .sub{font-size:12px;color:var(--muted)}
.card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.sect-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.divider{height:1px;background:var(--line);margin:16px 0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(244,247,251,.9));
  border:1px solid rgba(255,255,255,.9);color:var(--ink-2);
  box-shadow:0 8px 18px -14px rgba(40,50,70,.55),inset 0 1px 0 #fff;
  transition:transform .12s ease,box-shadow .18s,background .18s;
}
.btn:hover{box-shadow:0 12px 22px -14px rgba(40,50,70,.55),inset 0 1px 0 #fff}
.btn:active{transform:scale(.975)}
.btn.primary{
  color:#fff;background:linear-gradient(160deg,#7f96b5,#55708f);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 26px -16px rgba(55,80,115,.9);
}
.btn.primary:hover{background:linear-gradient(160deg,#87a0c0,#4f6c8c)}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line);color:var(--ink-2)}
.btn.danger{color:#8d4235;background:linear-gradient(180deg,#fff,#f8ece8);border-color:rgba(194,112,95,.25)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none;filter:saturate(.6)}
.btn.warm{color:#7c4a3c;background:linear-gradient(180deg,#fff,#f7ebe5);border-color:rgba(201,156,141,.35)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);border-color:rgba(111,134,166,.2);color:var(--accent-deep)}
.pill.warm{background:var(--warm-soft);border-color:rgba(201,156,141,.28);color:#8a5a4b}
.pill.green{background:var(--green-soft);border-color:rgba(138,163,146,.3);color:#4d6754}
.pill.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}

.chip{
  padding:8px 14px;border-radius:13px;font-size:13px;color:var(--ink-2);
  background:rgba(255,255,255,.66);border:1px solid var(--line);transition:.16s;white-space:nowrap;
}
.chip:hover{border-color:rgba(111,134,166,.35)}
.chip.on{background:linear-gradient(180deg,#fff,#e7edf6);border-color:rgba(111,134,166,.35);color:var(--accent-deep);font-weight:600;box-shadow:inset 0 1px 0 #fff,0 6px 14px -12px rgba(40,60,90,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- homepage ---------- */
.hero{padding:30px 28px;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;right:-80px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(140,163,190,.30),rgba(140,163,190,0) 68%);
  pointer-events:none;
}
.hero h2{font-size:clamp(22px,3.4vw,30px);line-height:1.32;letter-spacing:-.01em;font-weight:700}
.hero p{color:var(--muted);font-size:13.5px;margin-top:9px;max-width:52ch}
.hero .steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.opt-block{display:flex;flex-direction:column;gap:9px}
.opt-label{display:flex;align-items:baseline;gap:8px}
.opt-label b{font-size:13px;font-weight:650}
.opt-label span{font-size:11.5px;color:var(--muted)}
.topic-peek{
  display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(239,244,250,.7));
  border:1px solid rgba(255,255,255,.95);
}
.topic-peek .q{font-size:15px;font-weight:600;line-height:1.55}
.topic-peek .q-en{font-size:12.5px;color:var(--muted);line-height:1.5}
.duration-pick{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.duration-pick select{
  padding:7px 10px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:12.5px;
}

/* ---------- session ---------- */
.topic-pin{
  display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(240,245,251,.72));
  border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow-sm);
}
.topic-pin .mark{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding-top:2px;flex:0 0 74px}
.topic-pin .body{flex:1;min-width:0}
.topic-pin .body .zh{font-size:16.5px;font-weight:650;line-height:1.55}
.topic-pin .body .en{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 2px}
.timer{
  font-size:clamp(40px,9vw,62px);font-weight:650;letter-spacing:.02em;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--accent-deep);
}
.timer.warn{color:var(--danger);animation:beat 1s ease infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.timer-label{font-size:11.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.progress{width:100%;height:5px;border-radius:99px;background:rgba(32,36,44,.08);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9db2cb,#5f7fa4);width:0;transition:width .4s linear}
.progress.warn i{background:linear-gradient(90deg,#dcab9b,#b8604d)}

textarea.answer{
  width:100%;min-height:230px;resize:vertical;padding:18px;border-radius:18px;
  border:1px solid var(--line);background:rgba(255,255,255,.9);line-height:1.75;font-size:14.5px;
  box-shadow:inset 0 1px 3px rgba(20,30,45,.04);
}
textarea.answer:focus{outline:none;border-color:rgba(111,134,166,.5);box-shadow:0 0 0 4px rgba(111,134,166,.12)}
textarea.outline{min-height:120px;font-size:14px}
.answer-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.mic{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(160deg,#fff,#eef2f8);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 16px 30px -18px rgba(40,60,90,.7),inset 0 1px 0 #fff;transition:.2s;
}
.mic.on{background:linear-gradient(160deg,#8fa6c2,#5c7a9b);color:#fff;box-shadow:0 0 0 6px rgba(111,134,166,.14),0 16px 30px -18px rgba(40,60,90,.9)}
.mic svg{width:26px;height:26px}
.voice-zone{display:flex;align-items:center;gap:16px;padding:14px 0}
.wave{display:flex;gap:3px;align-items:flex-end;height:22px}
.wave i{width:3px;border-radius:2px;background:var(--accent);height:6px;opacity:.35;transition:.2s}
.wave.on i{opacity:.9;animation:wv .9s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.15s}
.wave.on i:nth-child(3){animation-delay:.3s}
.wave.on i:nth-child(4){animation-delay:.45s}
.wave.on i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:5px}50%{height:19px}}
.hint-line{font-size:12px;color:var(--muted);line-height:1.6}
.concept-card{
  display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;
  padding:34px 20px;border-radius:24px;
  background:linear-gradient(165deg,#fff,#eaf0f8);
  border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);
}
.concept-card .k{font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.01em}
.concept-card .e{font-size:14px;color:var(--accent-deep);letter-spacing:.06em;text-transform:uppercase}
.concept-card .d{font-size:12px;color:var(--muted);letter-spacing:.12em;margin-top:4px}
.concealed{filter:blur(9px);user-select:none;opacity:.55}

/* ---------- result ---------- */
.score-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score-big{font-size:clamp(46px,7vw,64px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score-big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.band{font-size:13px;padding:6px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);font-weight:650}
.radar{width:100%;max-width:250px;aspect-ratio:1;margin:0 auto}
.dim-row{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-bottom:1px dashed var(--line)}
.dim-row:last-child{border-bottom:0}
.dim-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.dim-row .top b{font-weight:600}
.dim-row .top .sc{font-variant-numeric:tabular-nums;color:var(--accent-deep);font-weight:650;font-size:12.5px}
.dim-bar{height:6px;border-radius:99px;background:rgba(32,36,44,.07);overflow:hidden}
.dim-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b6c5d8,#6f86a6)}
.dim-row .cmt{font-size:12px;color:var(--muted);line-height:1.6}
.list-block{display:flex;flex-direction:column;gap:9px}
.list-item{display:flex;gap:10px;font-size:13px;line-height:1.62;color:var(--ink-2)}
.list-item .b{flex:0 0 18px;height:18px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:2px}
.b.good{background:var(--green-soft);color:#4d6754}
.b.bad{background:var(--warm-soft);color:#8a5a4b}
.err-item{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.62);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.err-item .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.err-item .ex{font-size:13px;font-style:italic;color:var(--ink-2);border-left:2px solid rgba(111,134,166,.4);padding-left:9px}
.err-item .iss{font-size:12.5px}
.err-item .sug{font-size:12.5px;color:#4d6754}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13px}
.loading{display:flex;flex-direction:column;gap:12px;align-items:center;padding:26px}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(111,134,166,.2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- lists / history ---------- */
.list-row{
  display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);transition:.16s;
}
.list-row:hover{background:rgba(255,255,255,.85);box-shadow:var(--shadow-sm)}
.list-row .main-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.list-row .t{font-size:14px;font-weight:600;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .m{font-size:11.5px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.list-row .score{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;color:var(--accent-deep);min-width:44px;text-align:right}
.list-row .score.na{font-size:12px;color:var(--muted);font-weight:500}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.62);border:1px solid var(--line)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.cat-bar{display:flex;flex-direction:column;gap:6px;padding:9px 0}
.cat-bar .top{display:flex;justify-content:space-between;font-size:12.5px}
.cat-bar .bar{height:5px;border-radius:99px;background:rgba(32,36,44,.07);overflow:hidden}
.cat-bar .bar i{display:block;height:100%;background:linear-gradient(90deg,#dcb7a8,#c08d79);border-radius:99px}

/* ---------- settings ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .tip{font-size:11.5px;color:var(--muted);line-height:1.5}
.field input,.field select,.field textarea{
  padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.9);font-size:13px;
}
.field input:focus,.field select:focus{outline:none;border-color:rgba(111,134,166,.5);box-shadow:0 0 0 4px rgba(111,134,166,.12)}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#b9bec6}
.status-dot.ok{background:var(--green)}
.status-dot.bad{background:var(--danger)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:11px 18px;border-radius:13px;background:rgba(32,36,44,.9);color:#fff;font-size:13px;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.6);transition:.24s;z-index:99;max-width:82vw;text-align:center;
  backdrop-filter:blur(10px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- card modal ---------- */
.modal{position:fixed;inset:0;background:rgba(28,32,40,.5);backdrop-filter:blur(6px);display:none;place-items:center;z-index:90;padding:20px}
.modal.on{display:grid}
.modal-body{max-width:min(420px,94vw);max-height:88vh;overflow:auto;border-radius:22px;background:#fff;box-shadow:0 40px 80px -40px rgba(0,0,0,.6);padding:14px}
.modal-body img{width:100%;border-radius:14px;display:block}
.modal-actions{display:flex;gap:10px;margin-top:12px;justify-content:flex-end}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .shell{padding:14px;gap:0;flex-direction:column}
  .side{
    position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;width:100%;flex:none;z-index:60;
    flex-direction:row;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0;border-bottom:0;
  }
  .brand{display:none}
  .nav{flex-direction:row;flex:1;gap:2px}
  .nav-item{flex-direction:column;gap:3px;padding:8px 4px;font-size:11px;border-radius:12px;justify-content:center;text-align:center}
  .nav-item svg{width:19px;height:19px}
  .nav-item .dot{display:none}
  .side-foot{display:none}
  .main{padding-bottom:74px}

const mem = {};
const store = {
  get(k, d){
    try{
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : (mem[k] !== undefined ? mem[k] : d);
    }catch(e){ return mem[k] !== undefined ? mem[k] : d; }
  },
  set(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; }
  },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }
};

const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = (s)=> String(s == null ? '' : s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (n, a, b)=> Math.max(a, Math.min(b, n));
const round1 = (n)=> Math.round(n * 10) / 10;

function fmtClock(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  if(sec < 60) return sec + (app.lang === 'zh' ? ' 秒' : 's');
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + (app.lang === 'zh' ? ' 分 ' : 'm ') + (s ? s + (app.lang === 'zh' ? ' 秒' : 's') : '');
}
function fmtDate(iso){
  const d = new Date(iso);
  const p = (n)=> (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function countWords(text, lang){
  if(!text) return 0;
  if(lang === 'en'){
    const m = text.trim().match(/[A-Za-z0-9''-]+/g);
    return m ? m.length : 0;
  }
  return text.replace(/\s+/g, '').length;
}

function voiceEnv(){

  const host = location.hostname;
  const secure = !!window.isSecureContext || location.protocol === 'https:' || host === 'localhost' || host === '127.0.0.1';
  return {
    sr: !!SR,
    secure: secure,
    media: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),

  };
}

    (n.k === 'errors' && errorBank.filter(e=>!e.mastered).length ? '<span class="dot">' + errorBank.filter(e=>!e.mastered).length + '</span>' : '') +

function setView(name, data){
  clearTick();
  stopVoice(true);
  app.view = name;
  app.viewData = data || {};
  if(name !== 'answer') app.session = (name === 'result' || name === 'history') ? app.session : null;
  const hash = '#/' + name;
  if(location.hash !== hash){ try{ history.replaceState(null, '', hash); }catch(e){} }
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render(){
  renderNav(); renderLangSwitch();

    errors:viewErrors, settings:viewSettings, guide:viewGuide

}

function drawTopic(){
  if(app.mode === 'retell'){
    const pool = CONCEPTS;
    app.current = Object.assign({}, pool[Math.floor(Math.random()*pool.length)], {concept:true});
  } else {
    let pool = QUESTIONS.filter(q=> app.category==='all' || q.cat===app.category);
    if(!pool.length) pool = QUESTIONS;
    let pick = pool[Math.floor(Math.random()*pool.length)];
    // 避免与上一题重复
    if(app.current && app.current.id && pool.length > 1){
      let guard = 0;
      while(pick.id === app.current.id && guard++ < 8) pick = pool[Math.floor(Math.random()*pool.length)];
    }
    app.current = Object.assign({}, pick);
  }
  app.customText = '';
  setView('topic');
}

/* ============================================================
   计时器
   ============================================================ */
let tick = null;
function clearTick(){ if(tick){ clearInterval(tick); tick = null; } }
function runTimer(limitSec, handlers, offsetSec){
  clearTick();
  const start = Date.now();
  const offset = offsetSec || 0;
  const step = ()=>{
    const elapsed = offset + (Date.now() - start) / 1000;
    if(limitSec > 0){
      const left = Math.max(0, limitSec - elapsed);
      handlers.onTick(left, elapsed, limitSec);
      if(left <= 0){ clearTick(); handlers.onEnd && handlers.onEnd(elapsed); }
    } else {
      handlers.onTick(null, elapsed, 0);
    }
  };
  step();
  tick = setInterval(step, 200);
  return start;
}

  runTimer(limit, {

      app.prepSec = Math.round(limit);

      toast(app.lang==='zh'?'准备时间到，开始作答':'Prep time is up — start answering');

    app.prepSec = Math.round((Date.now() - startAt) / 1000);

      topicAlt: topicAlt(item),
      category: item.custom ? 'custom' : (item.concept ? (item.dom || 'concept') : item.cat),

function bindAnswer(){
  const s = ensureSession();
  const limit = s.limit || 0;
  const ta = document.getElementById('answerText');
  const timerEl = document.getElementById('timer');
  const progEl = document.getElementById('prog');
  const metaTime = document.getElementById('metaTime');
  const liveMeta = document.getElementById('liveMeta');
  submitted = false;

  ta.oninput = ()=>{
    s.content.text = ta.value;
    s.content.wordCount = countWords(ta.value, s.language);
    liveMeta.textContent = countWords(ta.value, s.language) + ' ' + (s.language==='en'?(app.lang==='zh'?'词':'words'):(app.lang==='zh'?'字':'chars'));
  };
  ta.focus();

  document.querySelectorAll('[data-input]').forEach(b=>{
    b.onclick = ()=>{
      s.content.text = ta.value;
      app.inputType = b.dataset.input;
      settings.defaultInputType = app.inputType;
      saveSettings();
      stopVoice(true);
      render();
    };
  });

  const peek = document.getElementById('peek');
  if(peek) peek.onclick = ()=>{
    if(s.recall.used >= s.recall.allowed) return;
    s.recall.used++;
    peek.disabled = true;
    peek.textContent = app.lang==='zh' ? '已回看' : 'Peeked';
    app.revealed = true;
    const body = document.getElementById('topicBody');
    body.classList.remove('concealed');
    setTimeout(()=>{
      app.revealed = false;
      const b2 = document.getElementById('topicBody');
      if(b2) b2.classList.add('concealed');
      render();
    }, 6000);
    toast(app.lang==='zh'?'概念名显示 6 秒':'Concept shown for 6 seconds');
  };

  const startAt = s._startAt || (s._startAt = Date.now());
  answerStartAt = startAt;
  const already = Math.max(0, (Date.now() - startAt) / 1000);
  runTimer(limit, {
    onTick(left, elapsed, total){
      answerElapsed = elapsed;
      timerEl.textContent = left === null ? fmtClock(elapsed) : fmtClock(left);
      const warn = left !== null && left <= 10;
      timerEl.classList.toggle('warn', warn);
      progEl.classList.toggle('warn', warn);
      progEl.querySelector('i').style.width = (total ? ((total - left) / total) * 100 : 0) + '%';
      metaTime.textContent = (app.lang==='zh'?'已用 ':'Elapsed ') + fmtDuration(elapsed);
    },
    onEnd(elapsed){
      answerElapsed = elapsed;
      if(submitted) return;
      toast(app.lang==='zh'?'时间到，自动提交':'Time is up — submitting');
      submitAnswer(true);
    }
  }, already);

  const btn = document.getElementById('submitBtn');
  btn.onclick = ()=> submitAnswer(false);

  if(s.inputType === 'voice') bindVoice(ta, s);
}

/* ---------- 语音识别 ---------- */
let rec = null, recState = 'idle', voiceBase = '', voiceFinal = '', voiceInterim = '', restarts = 0;

function bindVoice(ta, s){
  const btn = document.getElementById('micBtn');
  const wave = document.getElementById('wave');
  const status = document.getElementById('voiceStatus');

  btn.onclick = ()=>{
    if(recState === 'idle') startRec();
    else if(recState === 'recording') pauseRec();
    else if(recState === 'paused') resumeRec();
  };

  function setUI(){
    btn.classList.toggle('on', recState === 'recording');
    wave.classList.toggle('on', recState === 'recording');
    const zh = app.lang === 'zh';
    const env = voiceEnv();
    status.textContent = recState === 'recording' ? (zh?'正在识别…（再次点击暂停）':'Listening… (tap to pause)')
      : recState === 'paused' ? (zh?'已暂停，点击继续':'Paused — tap to resume')
      : !env.sr ? (zh?'当前浏览器不支持语音识别':'Speech recognition unavailable')
      : !env.secure ? (zh?'需用 http://localhost 打开才能说话':'Needs http://localhost')
      : (zh?'点击麦克风开始':'Tap the mic to start');
  }

  function errText(code){
    const zh = app.lang === 'zh';
    const map = {
      'not-allowed': zh ? '麦克风权限被拒绝：点地址栏的麦克风图标改成「允许」，再刷新' : 'Mic permission denied — allow it in the address bar, then reload',
      'service-not-allowed': zh ? '浏览器没有授权语音识别服务' : 'Speech service not allowed',
      'audio-capture': zh ? '没检测到麦克风设备，检查系统声音输入' : 'No microphone detected',
      'network': zh ? '语音服务连不上网络（国内网络常见），请改用文本作答' : 'Speech service unreachable — use text',
      'language-not-supported': zh ? '当前语言不被语音服务支持' : 'Language not supported by the service',
      'aborted': ''
    };
    return map[code] !== undefined ? map[code] : ((zh ? '语音启动失败：' : 'Speech failed: ') + code);
  }

  function newRec(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast(app.lang==='zh'?'浏览器不支持语音识别':'Speech recognition unavailable'); return null; }
    const r = new SR();
    r.lang = s.language === 'en' ? 'en-US' : 'zh-CN';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onstart = ()=>{
      const zh = app.lang === 'zh';
      status.textContent = zh ? '正在识别…（再次点击暂停）' : 'Listening… (tap to pause)';
      btn.classList.add('on'); wave.classList.add('on');
    };
    r.onresult = (e)=>{
      let interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        if(res.isFinal) voiceFinal += res[0].transcript;
        else interim += res[0].transcript;
      }
      voiceInterim = interim;
      ta.value = voiceBase + voiceFinal + interim;
      s.content.text = ta.value;
      s.content.wordCount = countWords(ta.value, s.language);
      const lm = document.getElementById('liveMeta');
      if(lm) lm.textContent = s.content.wordCount + ' ' + (s.language==='en'?(app.lang==='zh'?'词':'words'):(app.lang==='zh'?'字':'chars'));
    };
    r.onerror = (e)=>{
      if(e.error === 'no-speech' || e.error === 'aborted') return;
      recState = 'idle';
      setUI();
      const msg = errText(e.error);
      if(msg){ status.textContent = msg; toast(msg); }
    };
    r.onend = ()=>{
      if(recState === 'recording'){
        restarts++;
        if(restarts > 60){ recState = 'idle'; setUI(); return; }
        try{ r.start(); }catch(err){ recState = 'idle'; setUI(); }
      }
    };
    return r;
  }

  function startRec(){
    const env = voiceEnv();
    if(!env.sr){
      const msg = app.lang==='zh' ? '这个浏览器没有语音识别能力，请改用 Chrome / Edge 或文本作答' : 'This browser has no speech recognition — use Chrome/Edge or text';
      status.textContent = msg; toast(msg);
      return;
    }
    if(!env.secure){
      const msg = app.lang==='zh' ? '语音识别需要 http://localhost 或 https；现在是 file:// 打开，浏览器会拒绝启动。双击「启动网页.bat」后再试。' : 'Speech needs http://localhost or https; file:// is refused. Run start-web.bat first.';
      status.textContent = msg; toast(msg);
      return;
    }
    rec = newRec();
    if(!rec) return;
    voiceBase = (ta.value ? ta.value.replace(/\s+$/,'') + ' ' : '');
    voiceFinal = ''; voiceInterim = ''; restarts = 0;
    recState = 'recording';
    try{
      rec.start();
    }catch(e){
      recState = 'idle'; setUI();
      const msg = errText(e && e.name === 'InvalidStateError' ? 'invalid-state' : (e && e.name));
      status.textContent = msg; toast(msg);
      return;
    }
    setUI();
  }
  function pauseRec(){
    recState = 'paused';
    try{ rec && rec.stop(); }catch(e){}
    setUI();
  }
  function resumeRec(){
    voiceBase = ta.value.replace(/\s+$/,'') + ' ';
    voiceFinal = ''; voiceInterim = '';
    rec = newRec();
    if(!rec){ recState='idle'; setUI(); return; }
    recState = 'recording';
    try{ rec.start(); }catch(e){ recState='idle'; setUI(); return; }
    setUI();
  }
  window.__setVoiceUI = setUI;
  setUI();
}

function stopVoice(silent){
  try{ if(rec) rec.stop(); }catch(e){}
  rec = null;
  if(recState !== 'idle'){
    recState = 'idle';
    if(window.__setVoiceUI) window.__setVoiceUI();
  }
}

/* ============================================================
   提交
   ============================================================ */
function submitAnswer(auto){
  const s = app.session;
  if(!s || submitted) return;
  const ta = document.getElementById('answerText');
  if(ta) s.content.text = ta.value;
  const text = (s.content.text || '').trim();
  if(!text){
    if(auto){ toast(app.lang==='zh'?'没有内容，先写一句':'Nothing to submit yet'); return; }
    toast(app.lang==='zh'?'先写或说一点内容再提交':'Add something before submitting');
    return;
  }
  submitted = true;
  stopVoice(true);
  clearTick();
  s.timing.answerSec = Math.round(answerElapsed || ((Date.now() - answerStartAt) / 1000));
  s.timing.totalSec = (s.timing.prepareSec || 0) + (s.timing.searchSec || 0) + s.timing.answerSec;
  s.content.text = text;
  s.content.wordCount = countWords(text, s.language);
  s.content.fillers = countFillers(text, s.language);
  s.content.pauses = restarts;

  const existing = sessions.findIndex(x=>x.id === s.id);
  if(existing >= 0) sessions[existing] = s; else sessions.unshift(s);
  saveSessions();
  app.session = s;
  setView('result', {scoring:true});
  scoreSession(s);
}

function countFillers(text, lang){
  if(!text) return 0;
  if(lang === 'en'){
    const m = text.toLowerCase().match(/\b(um|uh|er|like|you know|actually|basically|sort of|kind of|i mean)\b/g);
    return m ? m.length : 0;
  }
  const m = text.match(/嗯+|呃+|那个|就是说|然后呢|其实吧|怎么说呢/g);
  return m ? m.length : 0;
}

function dimSet(session){

const RUBRIC = {

  enWrite:'任务回应（扣题、观点、论证展开、例证）；连贯与衔接（段落、逻辑顺序、衔接手段）；词汇丰富度（恰当、搭配、语体、拼写）；语法广度与准确度（句式、错误、标点）。',
  zhSpeak:'扣题与观点（是否回应题目、立场清晰）；结构与逻辑（开头—展开—结尾、层次、顺序）；内容支撑（例子、数据、理由）；语言表达（准确简洁、口头禅与冗余）；表达仪态仅基于转写弱推断（语速、停顿、自信度）。',

function rubricFor(s){
  if(s.mode === 'retell') return RUBRIC.retell;
  if(s.language === 'en') return s.inputType === 'voice' ? RUBRIC.enSpeak : RUBRIC.enWrite;
  return s.inputType === 'voice' ? RUBRIC.zhSpeak : RUBRIC.zhWrite;
}

function endpointToUrl(raw){
  let url = String(raw || '').trim().replace(/\/+$/, '');
  if(!url) return '';
  if(/\/chat\/completions(\?|$)/.test(url)) return url;
  // 已带版本段（/v1、/api/v3、/api/paas/v4、/compatible-mode/v1 等）时只补末段
  if(/\/(v\d+|api\/v\d+)$/.test(url)) return url + '/chat/completions';
  return url + '/v1/chat/completions';
}
function aiEndpoint(){
  return endpointToUrl(settings.ai.endpoint);
}
function isLocalEndpoint(){
  return /localhost|127\.0\.0\.1/i.test(settings.ai.endpoint || '');
}
function fetchFailHint(){
  const zh = app.lang === 'zh';
  if(isLocalEndpoint()){
    return zh
      ? '连不上本地代理。请双击「启动网页.bat」——它会同时开网页和代理（一个窗口即可），并保持窗口开着。'
      : 'Cannot reach the local proxy. Double-click start-web.bat (it starts both the page and the proxy) and keep the window open.';
  }
  return zh
    ? '浏览器拦下了这次请求（跨域 / Failed to fetch）。官方 API 一般不允许网页直连，请把 Endpoint 改成 http://localhost:8787/v1，并先双击「启动网页.bat」。'
    : 'Blocked by CORS (Failed to fetch). Most official APIs refuse browser calls — set Endpoint to http://localhost:8787/v1 and run start-web.bat.';
}

async function callAI(s){
  const ai = settings.ai;
  const url = aiEndpoint();
  if(!url || !ai.model) throw new Error('AI not configured');
  const dims = dimSet(s);
  const max = s.language === 'en' ? 9 : 5;
  const sys = [
    '你是一位严谨的双语表达考官，同时熟悉雅思口语/写作评分与结构化面试表达评估。',
    '只输出一个 JSON 对象，不要任何解释、Markdown 或代码块。',
    '评语、亮点、改进点、错误说明都用「作答语言」（' + (s.language==='en'?'English':'中文') + '）书写。',
    '分项满分 ' + max + '。总分即各分项平均分。',
    '错误清单必须引用原文片段（excerpt 为原文逐字摘录），类别只能取：语法错误、用词不当、搭配错误、表达不地道/中式、逻辑与结构问题、扣题偏差、拼写/标点、口头禅与停顿（语音）、术语错误（复述）、内容缺失（复述）。',
    'JSON 结构：{"overall":number,"band":string,"dimensions":[{"key":string,"name":string,"score":number,"max":number,"comment":string}],"strengths":[string],"improvements":[string],"errors":[{"category":string,"excerpt":string,"issue":string,"suggestion":string}],"retellCoverage":{"keyPoints":number,"totalKeyPoints":number}}',
    '待评分项（必须逐项使用这些 key 与中文名）：' + dims.map(d=>d.key + '/' + d.zh).join('，'),
    '评分口径：' + rubricFor(s),
  ].join('\n');
  const payload = {
    language: s.language, mode: s.mode, inputType: s.inputType, level: s.level,
    topic: s.topic, concept: s.isConcept ? s.topic : undefined,
    content: s.content.text,
    timing: { prepareSec: s.timing.prepareSec, searchSec: s.timing.searchSec, answerSec: s.timing.answerSec },
    wordCount: s.content.wordCount,
    fillers: s.content.fillers,
    rubric: rubricFor(s)
  };
  const ctrl = new AbortController();
  const to = setTimeout(()=> ctrl.abort(), 60000);
  let res;
  try{
    res = await fetch(url, {
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json'}, ai.apiKey ? {'Authorization':'Bearer ' + ai.apiKey} : {}),
      body: JSON.stringify({
        model: ai.model,
        temperature: 0.2,
        messages:[{role:'system', content:sys},{role:'user', content:JSON.stringify(payload)}]
      }),
      signal: ctrl.signal
    });
  }catch(e){
    if(e && e.name === 'AbortError') throw new Error('请求超时（60 秒没有响应）');
    throw new Error(fetchFailHint());
  }finally { clearTimeout(to); }
  if(!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error('HTTP ' + res.status + ' ' + txt.slice(0, 140));
  }
  const data = await res.json();
  const raw = (data.choices && data.choices[0] && (data.choices[0].message ? data.choices[0].message.content : data.choices[0].text)) || '';
  const parsed = extractJSON(raw);
  if(!parsed) throw new Error('AI 返回内容无法解析为 JSON');
  return normalizeReview(parsed, s);
}

function extractJSON(raw){
  if(!raw) return null;
  if(typeof raw === 'object') return raw;
  let txt = String(raw).trim();
  txt = txt.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try{ return JSON.parse(txt); }catch(e){}
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a >= 0 && b > a){
    try{ return JSON.parse(txt.slice(a, b+1)); }catch(e){}
  }
  return null;
}

function normalizeReview(r, s){
  const dims = dimSet(s);
  const max = s.language === 'en' ? 9 : 5;
  const byKey = {};
  (Array.isArray(r.dimensions) ? r.dimensions : []).forEach(d=>{ if(d && d.key) byKey[d.key] = d; });
  const dimensions = dims.map((d, i)=>{
    const src = byKey[d.key] || (Array.isArray(r.dimensions) ? r.dimensions[i] : null) || {};
    return {
      key: d.key,
      name: d[app.lang] || d.zh,
      score: clamp(Number(src.score) || 0, 0, max),
      max: max,
      comment: String(src.comment || '').slice(0, 400)
    };
  });
  const avg = dimensions.filter(d=>d.score > 0).length
    ? dimensions.reduce((a,d)=> a + d.score, 0) / dimensions.length : (Number(r.overall) || 0);
  const overall = s.language === 'en' ? round1(Math.round(avg * 2) / 2) : round1(avg);
  return {
    overall: clamp(overall, 0, max),
    band: String(r.band || bandFor(s.language, overall)),
    dimensions,
    strengths: (Array.isArray(r.strengths) ? r.strengths : []).map(x=>String(x)).filter(Boolean).slice(0, 5),
    improvements: (Array.isArray(r.improvements) ? r.improvements : []).map(x=>String(x)).filter(Boolean).slice(0, 5),
    errors: (Array.isArray(r.errors) ? r.errors : []).filter(e=>e && (e.issue || e.suggestion)).map(e=>({
      category: String(e.category || (s.language==='en'?'Grammar':'语言表达')),
      excerpt: String(e.excerpt || ''),
      issue: String(e.issue || ''),
      suggestion: String(e.suggestion || '')
    })).slice(0, 12),
    retellCoverage: r.retellCoverage || null
  };
}

function bandFor(lang, overall){
  if(lang === 'en') return overall.toFixed(1);
  if(overall >= 4.2) return '优秀';
  if(overall >= 3.4) return '良好';
  if(overall >= 2.6) return '合格';
  return '待提高';
}

/* ---------- 本地规则估算 ---------- */
const EN_CONN = ['however','moreover','therefore','because','although','while','firstly','secondly','finally','in addition','for example','as a result','on the other hand','that said','in conclusion'];
const ZH_CONN = ['首先','其次','再次','最后','因此','所以','但是','然而','此外','另外','一方面','另一方面','总之','例如','比如','换句话说','总结'];

function analyzeEN(text){
  const low = text.toLowerCase();
  const tokens = low.match(/[a-z][a-z''-]*/g) || [];
  const uniq = new Set(tokens);
  const sentences = text.split(/[.!?]+/).map(x=>x.trim()).filter(x=>x.length > 1);
  const avgLen = sentences.length ? tokens.length / sentences.length : tokens.length;
  const connectors = EN_CONN.filter(c=> low.indexOf(c) >= 0).length;
  const fillers = (low.match(/\b(um|uh|er|like|you know|actually|basically|sort of|kind of|i mean)\b/g) || []).length;
  const errors = [];
  const sentOf = (idx)=>{
    const before = text.slice(0, idx);
    const s = before.lastIndexOf('.');
    const e = text.slice(idx).search(/[.!?]/);
    return text.slice(s + 1, e >= 0 ? idx + e + 1 : Math.min(text.length, idx + 60)).trim();
  };
  const probes = [
    {re:/\ba\s+[aeiouAEIOU]\w+/g, cat:'语法错误', issue:'冠词 a/an 使用不当', sug:'元音音素前用 an，辅音前用 a。'},
    {re:/\bcan\s+to\s+[a-z]+/gi, cat:'语法错误', issue:'情态动词后误加 to', sug:'can/could/should 后直接接动词原形。'},
    {re:/\b(\w+)\s+\1\b/gi, cat:'口头禅与停顿（语音）', issue:'同一词连续重复', sug:'删掉重复词，保持流畅。'},
    {re:/(^|[.!?]\s+)i\b/g, cat:'拼写/标点', issue:'第一人称代词未大写', sug:'句首与指代自己时统一用大写 I。'},
    {re:/\bmore better\b|\bmost easiest\b/gi, cat:'语法错误', issue:'比较级重复叠加', sug:'better / easiest 本身已是比较级或最高级。'},
  ];
  probes.forEach(p=>{
    const m = text.match(p.re);
    if(m && m.length){
      errors.push({category:p.cat, excerpt:sentOf(Math.max(0, text.indexOf(m[0].replace(/^[.!?]\s+/, '')))), issue:p.issue, suggestion:p.sug});
    }
  });
  return {tokens:tokens.length, unique:uniq.size, ttr: tokens.length ? uniq.size / tokens.length : 0,
    sentences: sentences.length, avgLen, connectors, fillers, errors};
}

function analyzeZH(text){
  const chars = text.replace(/\s+/g, '');
  const sentences = text.split(/[。！？!?\n]+/).map(x=>x.trim()).filter(x=>x.length > 1);
  const connectors = ZH_CONN.reduce((a,c)=> a + (text.split(c).length - 1), 0);
  const fillers = (text.match(/嗯+|呃+|那个|就是说|然后呢|其实吧|怎么说呢/g) || []).length;
  const numbers = (text.match(/\d+|百分之|成|年|倍/g) || []).length;
  const examples = (text.match(/例如|比如|举个例子|举个例子说|譬如|以.{0,6}为例|研究表明|数据显示/g) || []).length;
  const errors = [];
  if(fillers >= 3) errors.push({category:'口头禅与停顿（语音）', excerpt: text.slice(0, 40), issue:'口头禅偏多（约 ' + fillers + ' 次）', suggestion:'每句话前先想好主语和动词，用停半拍代替「嗯、那个、就是说」。'});
  const rep = text.match(/(.{2,6})\1{2,}/);
  if(rep) errors.push({category:'逻辑与结构问题', excerpt: rep[0].slice(0, 40), issue:'同一表述连续重复', suggestion:'删掉重复段落，改用分点推进。'});
  return {chars: chars.length, sentences: sentences.length, connectors, fillers, numbers, examples, errors};
}

function relevantChars(topic){
  const stop = new Set('的是了在和与或也就都很更把被让对为上有下这那你我他她它们吗呢吧什如何么要会能可应该否一个中'.split(''));
  const set = new Set();
  (topic || '').replace(/\s+/g, '').split('').forEach(ch=>{
    if(!stop.has(ch) && /[\u4e00-\u9fa5]/.test(ch)) set.add(ch);
  });
  return Array.from(set);
}

function keywordOverlap(text, topic){
  if(text && text.length > 6 && /[A-Za-z]/.test(text)){
    const words = new Set((text.toLowerCase().match(/[a-z]{4,}/g) || []));
    const keys = (topic.toLowerCase().match(/[a-z]{4,}/g) || []).filter(w=> w.length > 3);
    if(!keys.length) return 0.5;
    return keys.filter(k=> words.has(k)).length / keys.length;
  }
  const chars = relevantChars(topic);
  if(!chars.length) return 0.5;
  const hit = chars.filter(c=> text.indexOf(c) >= 0).length;
  return hit / chars.length;
}

function localScore(s){
  const text = (s.content.text || '').trim();
  const isEN = s.language === 'en';
  const max = isEN ? 9 : 5;
  const dims = dimSet(s);
  const scores = {};
  const notes = {};
  let metrics;

  if(isEN){
    const a = analyzeEN(text);
    metrics = a;
    const lenAdequate = s.mode === 'retell' ? 90 : (s.inputType === 'voice' ? 120 : 180);
    const cover = keywordOverlap(text, s.topic);
    if(s.mode === 'retell'){
      scores.coverage = clamp(1 + (a.tokens / lenAdequate) * 5 + cover * 2, 1, 9);
      scores.terms = clamp(2.2 + cover * 5 + (a.ttr > .55 ? .8 : .2), 1, 9);
      scores.paraphrase = clamp(7.5 - (text.match(/[""「」]/g) || []).length * 0.6 - (text.match(/according to|research shows|the article/gi) || []).length * 0.5, 1, 9);
      scores.structure = clamp(2 + Math.min(4, a.connectors * 0.8) + (a.sentences >= 4 ? 1.6 : 0) + (a.avgLen > 25 ? -0.6 : 0), 1, 9);
      scores.language = clamp(2 + Math.min(3, a.ttr * 3) + Math.min(2.4, a.tokens / 45) - Math.min(1.8, a.fillers * 0.18), 1, 9);
      notes.coverage = '按篇幅与题面关键词重合度粗估。';
      notes.terms = '按概念词出现与用词多样性粗估。';
      notes.paraphrase = '引用/复述痕迹越多得分越低。';
      notes.structure = '按衔接词与句子数量粗估。';
      notes.language = '按词汇多样性与篇幅粗估。';
    } else if(s.inputType === 'voice'){
      scores.fluency = clamp(2.6 + Math.min(2.4, a.connectors * 0.45) + (a.avgLen >= 8 ? 1.1 : 0.4) - Math.min(2, a.fillers * 0.28), 1, 9);
      scores.lexical = clamp(2.4 + Math.min(3.2, a.ttr * 4) + Math.min(2.2, a.tokens / 55), 1, 9);
      scores.grammar = clamp(6.4 - a.errors.filter(e=>e.category==='语法错误').length * 0.65 + Math.min(1.6, a.sentences / 6), 1, 9);
      scores.pronunciation = 5.5;
      notes.fluency = '语速整理自转写长度与衔接词，停顿仅能弱推断。';
      notes.lexical = '按词汇多样性与篇幅估算。';
      notes.grammar = '按常见错误模式与句数估算。';
      notes.pronunciation = '转写无法评估发音细节，建议录音回听。';
    } else {
      scores.task = clamp(2 + cover * 3 + Math.min(2.6, a.tokens / 80) + Math.min(1.2, a.sentences / 6), 1, 9);
      scores.coherence = clamp(2 + Math.min(3.6, a.connectors * 0.75) + (a.sentences >= 5 ? 1.4 : 0.5), 1, 9);
      scores.lexical = clamp(2.4 + Math.min(3.2, a.ttr * 4) + Math.min(2.2, a.tokens / 60), 1, 9);
      scores.grammar = clamp(6.6 - a.errors.filter(e=>e.category==='语法错误').length * 0.7 + Math.min(1.4, a.sentences / 7), 1, 9);
      notes.task = '按扣题关键词与论证篇幅估算。';
      notes.coherence = '按衔接词与段落句数估算。';
      notes.lexical = '按词汇多样性估算。';
      notes.grammar = '按常见错误模式估算。';
    }
  } else {
    const a = analyzeZH(text);
    metrics = a;
    const adequacy = s.mode === 'retell' ? 220 : 320;
    const cover = keywordOverlap(text, s.topic);
    const stance = /我认为|我觉得|在我看来|应当|不应|应该|不应该|立场|主张/.test(text) ? 0.5 : 0;
    if(s.mode === 'retell'){
      scores.coverage = clamp(1.4 + Math.min(3, a.chars / adequacy * 3) + cover * 1.4, 1, 5);
      scores.terms = clamp(1.6 + cover * 2.6 + (text.indexOf(s.topic.slice(0,2)) >= 0 ? 0.6 : 0), 1, 5);
      scores.paraphrase = clamp(4.2 - (text.match(/「|」|“|”|根据资料|资料显示/g) || []).length * 0.5, 1, 5);
      scores.structure = clamp(1.4 + Math.min(2, a.connectors * 0.42) + (a.sentences >= 4 ? 0.9 : 0), 1, 5);
      scores.language = clamp(1.6 + Math.min(2.2, a.chars / 260 * 2.2) - Math.min(1.4, a.fillers * 0.14), 1, 5);
      notes.coverage = '按篇幅与题面关键词覆盖粗估。';
      notes.terms = '按概念名称与领域词使用粗估。';
      notes.paraphrase = '摘抄式表述会被扣分。';
      notes.structure = '按衔接词与段落句数粗估。';
      notes.language = '按篇幅与口头禅密度粗估。';
    } else {
      scores.relevance = clamp(1.6 + cover * 2.2 + stance, 1, 5);
      scores.structure = clamp(1.4 + Math.min(2.2, a.connectors * 0.4) + (a.sentences >= 4 ? 0.9 : 0.3), 1, 5);
      scores.support = clamp(1.2 + Math.min(1.6, a.examples * 0.7) + Math.min(1.2, a.numbers * 0.3) + Math.min(1.1, a.chars / 300), 1, 5);
      if(s.inputType === 'voice'){
        scores.language = clamp(1.8 + Math.min(2, a.chars / 280 * 2) - Math.min(1.4, a.fillers * 0.16), 1, 5);
        scores.presence = clamp(4.1 - Math.min(1.6, a.fillers * 0.2) + (a.chars > 260 ? 0.4 : 0), 1, 5);
        notes.presence = '仅凭转写推断语速与停顿，可信度有限。';
      } else {
        scores.language = clamp(1.9 + Math.min(2.2, a.chars / 320 * 2.2) - Math.min(1, a.fillers * 0.12), 1, 5);
      }
      notes.relevance = '按题面关键词覆盖与立场句估算。';
      notes.structure = '按衔接词与句子层次估算。';
      notes.support = '按举例与数据类表达估算。';
      notes.language = '按篇幅与冗余度估算。';
    }
  }

  const dimensions = dims.map(d=>({
    key:d.key, name:d[app.lang] || d.zh,
    score: round1(clamp(scores[d.key] || 1, 1, max)),
    max,
    comment: notes[d.key] || '基于本地规则估算。'
  }));
  const overall = isEN ? round1(Math.round((dimensions.reduce((a,d)=> a + d.score, 0) / dimensions.length) * 2) / 2)
                       : round1(dimensions.reduce((a,d)=> a + d.score, 0) / dimensions.length);

  /* 亮点 / 改进点 */
  const strengths = [], improvements = [];
  const f = (n)=> isEN ? n : n;
  if(isEN){
    if(metrics.connectors >= 2) strengths.push('衔接手段有意识使用（约 ' + metrics.connectors + ' 处），逻辑推进可辨。');
    if(metrics.ttr > 0.5) strengths.push('词汇重复控制得不错（类符/形符比 ' + metrics.ttr.toFixed(2) + '）。');
    if(metrics.avgLen >= 12) strengths.push('句子有一定长度与展开，不是碎片式表达。');
    if(metrics.tokens >= 120) strengths.push('内容量足够支撑一次完整作答（约 ' + metrics.tokens + ' 词）。');
    if(metrics.fillers <= 1) strengths.push('口头禅很少，听感干净。');
    if(!strengths.length) strengths.push('完成了从抽题到作答的闭环，先稳住流程再谈打磨。');
    if(metrics.connectors < 2) improvements.push('补衔接：however / therefore / for example 至少各用一次，让段落有骨架。');
    if(metrics.ttr <= 0.5) improvements.push('换词：把高频词（good, thing, very）替换成更具体的表达。');
    if(metrics.fillers >= 3) improvements.push('压缩口头禅：用 0.5 秒停顿替代 um / like / you know。');
    if(metrics.errors.length) improvements.push('优先修掉清单里的 ' + metrics.errors.length + ' 处硬错误，再谈句式多样。');
    if(metrics.tokens < 90) improvements.push('扩写：每个论点加一个具体例子或数字，避免只有观点。');
  } else {
    if(metrics.connectors >= 2) strengths.push('有分点意识，衔接词用了约 ' + metrics.connectors + ' 处。');
    if(metrics.examples > 0) strengths.push('给出了具体例子，不只是空泛表态。');
    if(metrics.chars >= 250) strengths.push('内容量够，能撑起一次完整复述/演讲。');
    if(metrics.fillers <= 1) strengths.push('口头禅控制得不错。');
    if(!strengths.length) strengths.push('立场基本立住了，下一步把结构做出来。');
    if(metrics.connectors < 2) improvements.push('加骨架：用「首先 / 其次 / 因此 / 最后」把观点串成三层。');
    if(metrics.examples === 0) improvements.push('补一个具体例子：时间、地点、数字，任选其一。');
    if(metrics.fillers >= 3) improvements.push('减少「嗯、那个、就是说」，用停顿代替填充词。');
    if(metrics.chars < 180) improvements.push('扩写：每个论点至少两句，一句观点一句解释。');
  }

  const errors = (metrics.errors || []).map(e=>Object.assign({}, e));
  if(!errors.length && s.content.fillers >= 3){
    errors.push({category:'口头禅与停顿（语音）', excerpt: text.slice(0, 40), issue:'转写中口头禅出现 ' + s.content.fillers + ' 次', suggestion:'刻意练习「想好再开口」，用停顿替代填充词。'});
  }
  if(text.length < (isEN ? 60 : 60)){
    errors.push({category:'内容缺失（复述）', excerpt:text.slice(0, 40), issue:'篇幅过短，论点没有展开', suggestion:'按「观点—理由—例子—回扣」四步各写一句。'});
  }

  return {
    overall, band: bandFor(s.language, overall),
    dimensions, strengths: strengths.slice(0, 4), improvements: improvements.slice(0, 4),
    errors: errors.slice(0, 8),
    retellCoverage: s.mode === 'retell' ? {keyPoints: Math.max(1, Math.round(dimensions[0].score)), totalKeyPoints: max} : null
  };
}

/* ---------- 评分入口 ---------- */
async function scoreSession(s){
  let review, source = 'local', errMsg = '';
  const configured = !!(settings.ai.endpoint && settings.ai.model);
  if(configured){
    try{
      review = await callAI(s);
      source = 'ai';
    }catch(e){
      errMsg = e && e.message ? e.message : 'AI 调用失败';
      review = localScore(s);
    }
  } else {
    review = localScore(s);
  }
  s.review = review;
  s.scored = true;
  s.aiMeta = {
    model: source === 'ai' ? settings.ai.model : 'local-rule',
    scoredAt: new Date().toISOString(),
    source,
    error: errMsg
  };
  const idx = sessions.findIndex(x=> x.id === s.id);
  if(idx >= 0) sessions[idx] = s; else sessions.unshift(s);
  saveSessions();
  aggregateErrors(s);
  if(errMsg) toast((app.lang==='zh'?'AI 不可用，已用本地规则估算：':'AI unavailable — local estimate: ') + errMsg.slice(0, 60));
  if(app.view === 'result') render();
  if(app.view === 'history' || app.view === 'errors') render();
}

function aggregateErrors(s){
  errorBank = errorBank.filter(e=> e.sessionId !== s.id);
  if(s.review && s.review.errors){
    s.review.errors.forEach((e, i)=>{
      errorBank.unshift({
        id: uid(),
        sessionId: s.id,
        language: s.language,
        mode: s.mode,
        category: e.category,
        excerpt: e.excerpt,
        issue: e.issue,
        suggestion: e.suggestion,
        mastered: false,
        createdAt: s.createdAt
      });
    });
  }
  saveErrors();
}

function drawRadar(canvas, dims){
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = 250, H = 250;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = '100%'; canvas.style.height = 'auto';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H/2 + 4, R = W * 0.34;
  const n = dims.length;
  const ang = (i)=> -Math.PI/2 + i * 2 * Math.PI / n;

  // grid
  for(let ring = 1; ring <= 4; ring++){
    ctx.beginPath();
    for(let i = 0; i < n; i++){
      const r = R * ring / 4;
      const x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = ring === 4 ? 'rgba(32,36,44,.16)' : 'rgba(32,36,44,.07)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  for(let i = 0; i < n; i++){
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang(i)) * R, cy + Math.sin(ang(i)) * R);
    ctx.strokeStyle = 'rgba(32,36,44,.07)';
    ctx.stroke();
  }
  // shape
  ctx.beginPath();
  dims.forEach((d, i)=>{
    const ratio = clamp(d.score / d.max, 0, 1);
    const x = cx + Math.cos(ang(i)) * R * ratio, y = cy + Math.sin(ang(i)) * R * ratio;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.closePath();
  const grad = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  grad.addColorStop(0, 'rgba(255,178,202,.62)');
  grad.addColorStop(.6, 'rgba(255,146,176,.5)');
  grad.addColorStop(1, 'rgba(198,176,240,.52)');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(226,104,140,.85)'; ctx.lineWidth = 1.6; ctx.stroke();

  // dots
  dims.forEach((d, i)=>{
    const ratio = clamp(d.score / d.max, 0, 1);
    ctx.beginPath();
    ctx.arc(cx + Math.cos(ang(i)) * R * ratio, cy + Math.sin(ang(i)) * R * ratio, 3, 0, Math.PI*2);
    ctx.fillStyle = '#e2688c'; ctx.fill();
  });

  // labels
  ctx.font = '600 11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(60,66,76,.78)';
  dims.forEach((d, i)=>{
    const label = d.name.replace(/（.*）/,'').replace(/ \(.*\)/, '');
    const x = cx + Math.cos(ang(i)) * (R + 26);
    const y = cy + Math.sin(ang(i)) * (R + 26);
    ctx.textAlign = Math.abs(Math.cos(ang(i))) < 0.3 ? 'center' : (Math.cos(ang(i)) > 0 ? 'left' : 'right');
    ctx.textBaseline = 'middle';
    ctx.fillText(label.length > 7 ? label.slice(0, 7) : label, x, y);
  });
}

/* ---------- 结果卡片（Canvas 1080×1440） ---------- */
function buildCard(s){
  const W = 1080, H = 1440;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const isEN = s.language === 'en';
  const r = s.review;

  // background
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#fff6f3');
  bg.addColorStop(.5, '#fff1f7');
  bg.addColorStop(.78, '#eff4ff');
  bg.addColorStop(1, '#eafaf4');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // soft blobs
  const blob = (x, y, rad, col)=>{
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill();
  };
  blob(W*0.86, 90, 330, 'rgba(255,160,192,.30)');
  blob(W*0.1, H*0.9, 390, 'rgba(190,175,245,.22)');
  blob(W*0.55, H*0.35, 300, 'rgba(160,235,215,.14)');

  // panel
  const px = 70, py = 90, pw = W - 140, ph = H - 180;
  ctx.save();
  ctx.shadowColor = 'rgba(40,50,70,.18)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 18;
  ctx.fillStyle = 'rgba(255,255,255,.74)';
  roundRect(ctx, px, py, pw, ph, 48); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  roundRect(ctx, px, py, pw, ph, 48); ctx.stroke();

  // header
  ctx.fillStyle = '#a3859a';
  ctx.font = '600 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('I M P R O M P T U   L A B', px + 56, py + 78);
  ctx.textAlign = 'right';
  ctx.font = '400 19px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(fmtDate(s.createdAt).slice(0, 10), px + pw - 56, py + 78);

  // pills
  ctx.textAlign = 'left';
  let cx0 = px + 56, cy0 = py + 120;
  const pill = (label, w)=>{
    ctx.fillStyle = 'rgba(255,143,168,.16)';
    roundRect(ctx, cx0, cy0, w, 42, 21); ctx.fill();
    ctx.fillStyle = '#c4506f';
    ctx.font = '600 19px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(label, cx0 + 18, cy0 + 28);
    cx0 += w + 12;
  };
  pill(isEN ? 'ENGLISH' : '中文', isEN ? 116 : 86);
  pill(s.mode === 'retell' ? 'CONCEPT RETELL' : 'IMPROMPTU', s.mode === 'retell' ? 206 : 178);
  pill(s.inputType === 'voice' ? (isEN ? 'VOICE' : '语音') : (isEN ? 'TEXT' : '文本'), s.inputType === 'voice' ? (isEN ? 100 : 86) : 86);

  // topic
  ctx.fillStyle = '#242a33';
  ctx.font = '700 44px "PingFang SC","Microsoft YaHei",sans-serif';
  const topicLines = wrapText(ctx, s.topic, pw - 112, 3);
  topicLines.forEach((line, i)=> ctx.fillText(line, px + 56, py + 236 + i * 58));

  // score
  const sy = py + 236 + topicLines.length * 58 + 66;
  ctx.fillStyle = '#2b3440';
  ctx.font = '700 104px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(r.overall.toFixed(1), px + 50, sy + 78);
  const scoreW = ctx.measureText(r.overall.toFixed(1)).width;
  ctx.fillStyle = '#a8899a';
  ctx.font = '400 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('/ ' + (isEN ? 9 : 5), px + 70 + scoreW, sy + 76);
  ctx.fillStyle = '#c4506f';
  ctx.font = '600 28px "PingFang SC","Microsoft YaHei",sans-serif';
  const bandText = r.band;
  const bw = ctx.measureText(bandText).width + 40;
  ctx.fillStyle = 'rgba(255,143,168,.16)';
  roundRect(ctx, px + pw - 56 - bw, sy + 22, bw, 52, 26); ctx.fill();
  ctx.fillStyle = '#bd4064';
  ctx.font = '600 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(bandText, px + pw - 56 - bw + 20, sy + 58);

  // dims
  let dy = sy + 150;
  const dimW = pw - 112;
  r.dimensions.slice(0, 5).forEach(d=>{
    ctx.fillStyle = '#4a3654';
    ctx.font = '600 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(d.name.replace(/（.*）/,'').replace(/ \(.*\)/, ''), px + 56, dy);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#b07a95';
    ctx.font = '600 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(d.score.toFixed(1) + ' / ' + d.max, px + pw - 56, dy);
    ctx.textAlign = 'left';
    const ratio = clamp(d.score / d.max, 0, 1);
    ctx.fillStyle = 'rgba(32,36,44,.08)';
    roundRect(ctx, px + 56, dy + 14, dimW, 10, 5); ctx.fill();
    const g = ctx.createLinearGradient(px + 56, 0, px + 56 + dimW, 0);
    g.addColorStop(0, '#ffd3e0'); g.addColorStop(.6, '#ff97b3'); g.addColorStop(1, '#c7b2f2');
    ctx.fillStyle = g;
    roundRect(ctx, px + 56, dy + 14, Math.max(8, dimW * ratio), 10, 5); ctx.fill();
    dy += 66;
  });

  // highlights
  const blockY = Math.max(dy + 24, py + ph - 330);
  ctx.fillStyle = 'rgba(32,36,44,.08)';
  ctx.fillRect(px + 56, blockY - 26, pw - 112, 1);

  const drawBlock = (label, text, y, color)=>{
    ctx.fillStyle = color;
    ctx.font = '600 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(label, px + 56, y);
    ctx.fillStyle = '#3c444f';
    ctx.font = '400 21px "PingFang SC","Microsoft YaHei",sans-serif';
    wrapText(ctx, text, pw - 112, 2).forEach((line, i)=> ctx.fillText(line, px + 56, y + 34 + i * 30));
  };
  drawBlock(isEN ? 'WHAT WORKED' : '亮点', (r.strengths[0] || '—'), blockY + 26, '#5f9c86');
  drawBlock(isEN ? 'NEXT MOVE' : '下一步', (r.improvements[0] || '—'), blockY + 122, '#c07a5e');

  // footer
  ctx.fillStyle = '#a3899a';
  ctx.font = '400 19px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText((isEN ? 'Generated locally · ' : '本地生成 · ') + fmtDuration(s.timing.totalSec), px + 56, py + ph - 32);
  ctx.textAlign = 'right';
  ctx.fillText(s.aiMeta && s.aiMeta.source === 'ai' ? 'AI ' + (s.aiMeta.model || '') : (isEN ? 'LOCAL RULE' : '本地规则'), px + pw - 56, py + ph - 32);

  return cv;
}

function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(ctx, text, maxW, maxLines){
  const out = [];
  let line = '';
  const chars = Array.from(String(text || ''));
  for(const ch of chars){
    const test = line + ch;
    if(ctx.measureText(test).width > maxW && line){
      out.push(line);
      line = ch;
      if(out.length >= maxLines - 1){ break; }
    } else line = test;
  }
  // 若提前截断，补省略号
  const consumed = out.join('').length;
  const rest = String(text || '').slice(consumed);
  if(out.length >= maxLines - 1 && ctx.measureText(line + rest).width > maxW){
    line = line.replace(/.$/,'…');
  }
  out.push(line);
  return out.slice(0, maxLines);
}

function bindResult(){
  const s = currentRecord();
  if(!s) return;
  if(s.scored && s.review) drawRadar(document.getElementById('radarCanvas'), s.review.dimensions);

  const rescore = document.getElementById('rescore');
  if(rescore) rescore.onclick = ()=>{
    s.scored = false; s.review = null;
    app.session = s;
    setView('result', {record:s, scoring:true});
    scoreSession(s);
  };

  const again = document.getElementById('again');
  if(again) again.onclick = ()=>{ app.session = null; app.outline = ''; drawTopic(); };

  const mk = document.getElementById('makeCard');
  if(mk) mk.onclick = ()=>{
    if(!s.scored) return;
    const cv = buildCard(s);
    const url = cv.toDataURL('image/png');
    const body = document.getElementById('modalBody');
    body.innerHTML = '<img alt="result card" src="' + url + '">' +
      '<div class="modal-actions">' +
        '<button class="btn ghost" id="closeModal">Close</button>' +
        '<button class="btn primary" id="dlCard">PNG</button>' +
      '</div>';
    document.getElementById('modal').classList.add('on');
    body.querySelector('#closeModal').onclick = closeModal;
    body.querySelector('#dlCard').onclick = ()=>{
      const a = document.createElement('a');
      a.download = (app.lang==='zh'?'表达复盘卡-':'review-card-') + s.createdAt.slice(0,10) + '.png';
      a.href = url; a.click();
    };
  };

  const cp = document.getElementById('copySummary');
  if(cp) cp.onclick = async ()=>{
    if(!s.scored) return;
    const r = s.review;
    const txt = (app.lang==='zh'?'【表达复盘】\n':'【Review】\n') + s.topic + '\n' +
      (app.lang==='zh'?'总分 ':'Score ') + r.overall.toFixed(1) + ' · ' + r.band + '\n' +
      (app.lang==='zh'?'分项：':'Dimensions: ') + r.dimensions.map(d=>d.name.replace(/（.*）/,'') + ' ' + d.score.toFixed(1)).join(' / ') + '\n' +
      (app.lang==='zh'?'亮点：':'Won: ') + (r.strengths[0] || '—') + '\n' +
      (app.lang==='zh'?'下一步：':'Next: ') + (r.improvements[0] || '—');
    try{ await navigator.clipboard.writeText(txt); toast(app.lang==='zh'?'摘要已复制':'Summary copied'); }
    catch(e){ toast(app.lang==='zh'?'复制失败，请手动选择':'Copy failed'); }
  };
}

/* ============================================================

   ============================================================ */
function errorCats(){
  const map = {};
  errorBank.forEach(e=>{ map[e.category] = (map[e.category] || 0) + 1; });
  return Object.keys(map).map(k=>({cat:k, n:map[k]})).sort((a,b)=> b.n - a.n);
}

function withinRange(iso, range){
  if(range === 'all') return true;
  const days = range === '7' ? 7 : 30;
  return (Date.now() - new Date(iso).getTime()) < days * 86400000;
}

function viewErrors(){
  const zh = app.lang === 'zh';
  const f = app.filters;
  const cats = errorCats();
  const total = errorBank.length;
  const visible = errorBank.filter(e=>
    (f.errLang === 'all' || e.language === f.errLang) &&
    (f.errCat === 'all' || e.category === f.errCat) &&
    withinRange(e.createdAt, f.errRange) &&
    (f.showMastered ? true : !e.mastered)
  );
  const openCount = errorBank.filter(e=>!e.mastered).length;
  return '' +

function bindErrors(){
  document.querySelectorAll('[data-ef]').forEach(b=>{
    b.onclick = ()=>{ app.filters[b.dataset.ef] = b.dataset.ev; render(); };
  });
  const tm = document.querySelector('[data-toggle-mastered]');
  if(tm) tm.onclick = ()=>{ app.filters.showMastered = !app.filters.showMastered; render(); };
  document.querySelectorAll('[data-master]').forEach(b=>{
    b.onclick = ()=>{
      const e = errorBank.find(x=> x.id === b.dataset.master);
      if(!e) return;
      e.mastered = !e.mastered;
      saveErrors(); render();
    };
  });
  document.querySelectorAll('[data-jump]').forEach(b=>{
    b.onclick = ()=>{
      const s = sessions.find(x=> x.id === b.dataset.jump);
      if(!s){ toast(app.lang==='zh'?'找不到这场记录':'Session not found'); return; }
      app.session = s;
      setView('result', {record:s});
    };
  });
}

      '<div class="mini-row"><div class="k">' + esc(zh?'解法':'Fix') + '</div><div class="v">' + esc(zh?'双击「启动网页.bat」，浏览器会自动打开 http://localhost:8080，在这个地址里用语音即可（推荐 Chrome / Edge）。':'Double-click start-web.bat — it opens http://localhost:8080 where speech works.') + '</div></div>' +
      '<div class="mini-row"><div class="k">' + esc(zh?'权限':'Permission') + '</div><div class="v">' + esc(zh?'第一次点麦克风，浏览器会弹「允许使用麦克风」；若误点拒绝，点地址栏左侧的图标改成允许，再刷新。':'Allow the mic on first prompt; if denied, fix it in the address-bar permissions and reload.') + '</div></div>' +
      '<div class="mini-row"><div class="k">' + esc(zh?'网络':'Network') + '</div><div class="v">' + esc(zh?'Chrome 的语音识别要连 Google 的语音服务，国内网络可能报 network 错误，此时只能用文本作答。':'Chrome sends audio to an online service; restricted networks may throw a network error — use text then.') + '</div></div>' +
    '</div>' +
    '<div class="divider"></div>' +
    '<div class="row" style="justify-content:space-between">' +
      '<div class="row">' +
        '<button class="btn" id="testMic">' + esc(zh?'自检麦克风':'Check microphone') + '</button>' +
        '<span class="tiny muted" id="micStatus">' + esc(zh?'点一下看看设备与权限':'Tap to check device & permission') + '</span>' +
      '</div>' +
      '<button class="btn primary" id="backSettings">' + esc(zh?'去填配置':'Go to settings') + ' →</button>' +
    '</div>' +
  '</div>' +

  '<div class="card flat">' +
    '<div class="card-head"><h2>' + esc(zh?'费用与隐私':'Cost & privacy') + '</h2></div>' +
    '<p class="hint-line">' + esc(zh?'一次评分大约几百到一千 token，按常见价格约几分钱；建议在服务商后台设一个月度限额。Key 只存在你这台机器的浏览器里，页面代码不会上传它；但如果把浏览器数据导出给别人，Key 也会一起带走。':'One review costs a few hundred to ~1k tokens — pennies. Set a monthly cap at the provider. The key stays in this browser’s localStorage; an exported JSON would contain it.') + '</p>' +
  '</div>';
}

function bindGuide(){
  const zh = app.lang === 'zh';
  document.querySelectorAll('[data-preset]').forEach(b=>{
    b.onclick = ()=>{
      const p = AI_PRESETS[Number(b.dataset.preset)];
      if(!p) return;
      settings.ai.endpoint = p.url;
      settings.ai.model = p.model;
      saveSettings();
      toast(zh ? ('已填入 ' + p.name + '，接着粘 Key 并测试') : ('Filled ' + p.name + ' — paste the key and test'));
      setView('settings');
    };
  });
  const mic = document.getElementById('testMic');
  if(mic) mic.onclick = async ()=>{
    const st = document.getElementById('micStatus');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      st.textContent = zh ? '这个浏览器不给用麦克风接口' : 'No microphone API here';
      return;
    }
    st.textContent = zh ? '正在申请权限…' : 'Asking permission…';
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const devices = await navigator.mediaDevices.enumerateDevices();
      const n = devices.filter(d=> d.kind === 'audioinput').length;
      stream.getTracks().forEach(tk=> tk.stop());
      st.textContent = zh ? ('麦克风可用 · 检测到 ' + n + ' 个输入设备') : ('Mic works · ' + n + ' input device(s)');
      toast(zh ? '麦克风权限正常' : 'Microphone OK');
    }catch(err){
      const name = err && err.name ? err.name : 'Error';
      const map = {
        NotAllowedError: zh ? '权限被拒绝：点地址栏的麦克风图标改成允许，再刷新' : 'Permission denied — allow it in the address bar, then reload',
        NotFoundError: zh ? '没找到麦克风设备，检查系统声音设置' : 'No microphone found',
        NotReadableError: zh ? '设备被别的程序占用（会议/录音软件）' : 'Device busy in another app',
        SecurityError: zh ? '当前地址不安全，需用 http://localhost' : 'Insecure context — use http://localhost'
      };
      st.textContent = (map[name] || name);
      toast(st.textContent);
    }
  };
  const back = document.getElementById('backSettings');
  if(back) back.onclick = ()=> setView('settings');
  const tp = document.getElementById('testProxy');
  if(tp) tp.onclick = async ()=>{
    const st = document.getElementById('proxyStatus');
    st.textContent = zh ? '检测中…' : 'Checking…';
    try{
      const r = await fetch('http://localhost:8787/v1/chat/completions', { method:'OPTIONS' });
      st.textContent = zh ? ('代理活着（HTTP ' + r.status + '），可以去设置填地址了') : ('Proxy alive (HTTP ' + r.status + ')');
    }catch(e){
      st.textContent = zh ? '连不上：双击「启动网页.bat」并保持窗口开着' : 'Unreachable — run start-web.bat and keep it open';
    }
  };
}

function bindSettings(){
  const zh = app.lang === 'zh';
  const og = document.getElementById('openGuide');
  if(og) og.onclick = ()=> setView('guide');
  document.getElementById('saveAI').onclick = ()=>{
    settings.ai = {
      endpoint: document.getElementById('aiEndpoint').value.trim(),
      apiKey: document.getElementById('aiKey').value.trim(),
      model: document.getElementById('aiModel').value.trim()
    };
    saveSettings();
    toast(zh?'已保存 AI 配置':'AI settings saved');
    render();
  };
  document.getElementById('testAI').onclick = async ()=>{
    const endpoint = document.getElementById('aiEndpoint').value.trim();
    const key = document.getElementById('aiKey').value.trim();
    const model = document.getElementById('aiModel').value.trim();
    if(!endpoint || !model){ toast(zh?'先填地址和模型名':'Fill endpoint and model first'); return; }
    const url = endpointToUrl(endpoint);
    const prev = settings.ai.endpoint;
    settings.ai.endpoint = endpoint;
    toast(zh?'测试中…':'Testing…');
    try{
      const res = await fetch(url, {
        method:'POST',
        headers: Object.assign({'Content-Type':'application/json'}, key?{'Authorization':'Bearer '+key}:{}),
        body: JSON.stringify({model, temperature:0, max_tokens:16, messages:[{role:'user',content:'Reply with the single word: ok'}]})
      });
      if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 90));
      await res.json();
      toast(zh?'连接成功，可以评分了':'Connection OK');
    }catch(e){
      const msg = (e && /^(HTTP |请求超时)/.test(e.message || '')) ? e.message : fetchFailHint();
      toast((zh?'连接失败：':'Failed: ') + msg.slice(0, 160));
    }finally{
      settings.ai.endpoint = prev;
    }
  };
  const map = {defLang:'defaultLanguage', defMode:'defaultMode', defInput:'defaultInputType', defLevel:'defaultLevel'};
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.onchange = ()=>{
      settings[map[id]] = el.value;
      saveSettings();
      if(id === 'defLang'){ app.lang = el.value; }
      if(id === 'defMode'){ app.mode = el.value; }
      if(id === 'defInput'){ app.inputType = el.value; }
      if(id === 'defLevel'){ app.level = el.value; }
      toast(zh?'默认偏好已更新':'Defaults updated');
      render();
    };
  });

  let armed = false, armTimer = null;
  const clearBtn = document.getElementById('clearData');
  clearBtn.onclick = ()=>{
    if(!armed){
      armed = true;
      clearBtn.textContent = app.lang==='zh'?'再次点击确认清空':'Click again to confirm';
      armTimer = setTimeout(()=>{ armed = false; clearBtn.textContent = app.lang==='zh'?'清空本地数据':'Clear data'; }, 4000);
      return;
    }
    clearTimeout(armTimer);
    sessions = []; errorBank = [];
    saveSessions(); saveErrors();
    toast(app.lang==='zh'?'本地数据已清空':'Local data cleared');
    setView('home');
  };

  document.getElementById('exportData').onclick = ()=>{
    const payload = {
      exportedAt: new Date().toISOString(),
      version: '1.0',
      settings, sessions, errors: errorBank
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'impromptu-lab-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
    toast(app.lang==='zh'?'已导出 JSON':'JSON exported');
  };
}

/* ============================================================
   绑定分发 & 启动
   ============================================================ */
function bindView(name){
  const fn = ({
    home:bindHome, topic:bindTopic, prep:bindPrep, search:bindSearch,
    answer:bindAnswer, result:bindResult, history:bindHistory,
    errors:bindErrors, settings:bindSettings, guide:bindGuide
  })[name];
  if(fn) fn();
}

document.getElementById('modal').addEventListener('click', (e)=>{
  if(e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });

(function boot(){
  const h = (location.hash || '').replace('#/','');
  if(['history','errors','settings','guide'].indexOf(h) >= 0) app.view = h;
  render();
})();
</script>
