name: import index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-index.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch single-file app
        run: |
          curl -fL --retry 3 -o index.html "https://aka.doubaocdn.com/s/TtfL3oZISh"
          ls -l index.html
          head -c 40 index.html
      - name: Commit
        run: |
          git config user.name "impromptu-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add single-file app index.html"
          git push
