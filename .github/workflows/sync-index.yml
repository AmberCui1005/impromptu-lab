name: sync-files
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          curl -sSfL "https://aka.doubaocdn.com/s/UiJABAEstI" -o index.html
          curl -sSfL "https://aka.doubaocdn.com/s/BN1AB0bJ87" -o README.md
          curl -sSfL "https://aka.doubaocdn.com/s/RqUjJPOloA" -o serve.js
          curl -sSfL "https://aka.doubaocdn.com/s/LFlVlMv7Li" -o proxy.js
          curl -sSfL "https://aka.doubaocdn.com/s/qssFeaIWni" -o "启动网页.bat"
      - name: Commit
        run: |
          git config user.name "impromptu-bot"
          git config user.email "impromptu-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync app files" || true
          git push
