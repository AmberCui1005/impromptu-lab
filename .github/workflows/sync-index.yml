name: sync index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-index.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch single-file app
        run: |
          curl -fL --retry 3 -o index.html "https://aka.doubaocdn.com/s/7O6XScEUlg"
          ls -l index.html
      - name: Commit
        run: |
          git config user.name "impromptu-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no change" || (git commit -m "style: jelly candy theme" && git push)
