name: sync-files
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          curl -sSfL "https://aka.doubaocdn.com/s/BtkeUZQaQA" -o index.html
          curl -sSfL "https://aka.doubaocdn.com/s/pw5bmhu49V" -o README.md
      - name: Commit
        run: |
          git config user.name "impromptu-bot"
          git config user.email "impromptu-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync app files" || true
          git push
