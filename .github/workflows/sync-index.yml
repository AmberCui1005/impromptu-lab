name: sync-index
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download index
        run: curl -sSfL "https://aka.doubaocdn.com/s/SMArVUa9H4" -o index.html
      - name: Commit
        run: |
          git config user.name "impromptu-bot"
          git config user.email "impromptu-bot@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync index.html" || true
          git push
